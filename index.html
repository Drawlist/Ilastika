<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My first page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="Words"><p>Этот сайт <b><big>тестовый</big></b>, можете выходить с него. Тут я тренируюсь для дальнейших сайтов.</p></div>
  <hr> 
  <div id="Work"><p>Введутся технические работы</p>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQoPWD5OJtEWmVw2Iomuc4O-V-MlAhsQFoQgw&s" title="Технические работы" alt="Man working"></div>
  <div id="container">
  <div id="Input"><input type="text" placeholder="Введите для автора" maxlength="30">
  <button type="submit">Отправить</button></div>
  <p id="result"></p>
  <script src="script.js"></script>

  <script>
    const input = document.querySelector('#Input input');
    const button = document.querySelector('#Input button');
    const result = document.getElementById('result');

    button.addEventListener('click', () => {
      const userInput = input.value.trim();
      if (userInput) {
        result.textContent = `Вы ввели "${userInput}!" Спасибо за ваше сообщение.`;
      } else {
        result.textContent = 'Пожалуйста, введите что-то перед отправкой.';
      }
    });
  </script>
  <div id="Footer"><footer> <p>© 2026 Все права защищены.</p> 
  </footer></div>
</body>
</html>
